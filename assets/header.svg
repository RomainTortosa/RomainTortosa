<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="220"
  viewBox="0 0 1200 220"
  role="img"
  aria-label="Romain Tortosa - IT Software Infrastructure"
>
  <defs>
    <linearGradient id="rt-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#53aee5"/>
      <stop offset="100%" stop-color="#59cf79"/>
    </linearGradient>

    <linearGradient id="rt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a0e"/>
      <stop offset="55%" stop-color="#0e1218"/>
      <stop offset="100%" stop-color="#101820"/>
    </linearGradient>

    <radialGradient id="glow-blue" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#53aee5" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#53aee5" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-green" cx="100%" cy="100%" r="90%">
      <stop offset="0%" stop-color="#59cf79" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#59cf79" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="220" rx="18" fill="url(#rt-bg)"/>

  <!-- Subtle glows -->
  <rect width="1200" height="220" rx="18" fill="url(#glow-blue)"/>
  <rect width="1200" height="220" rx="18" fill="url(#glow-green)"/>

  <!-- Decorative circuit lines -->
  <g
    fill="none"
    stroke="#53aee5"
    stroke-opacity="0.12"
    stroke-width="1"
  >
    <path d="M0 45 H140 L175 80 H285"/>
    <path d="M0 175 H95 L135 135 H245"/>
    <circle cx="285" cy="80" r="3" fill="#53aee5"/>
    <circle cx="245" cy="135" r="3" fill="#53aee5"/>
  </g>

  <g
    fill="none"
    stroke="#59cf79"
    stroke-opacity="0.12"
    stroke-width="1"
  >
    <path d="M1200 45 H1060 L1025 80 H915"/>
    <path d="M1200 175 H1105 L1065 135 H955"/>
    <circle cx="915" cy="80" r="3" fill="#59cf79"/>
    <circle cx="955" cy="135" r="3" fill="#59cf79"/>
  </g>

  <!-- Name -->
  <text
    x="600"
    y="100"
    text-anchor="middle"
    fill="#f3f6f8"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="48"
    font-weight="700"
    letter-spacing="-1.5"
  >
    ROMAIN TORTOSA
  </text>

  <!-- Gradient separator -->
  <rect
    x="475"
    y="120"
    width="250"
    height="2"
    rx="1"
    fill="url(#rt-gradient)"
  />

  <!-- Subtitle -->
  <text
    x="600"
    y="158"
    text-anchor="middle"
    fill="#8d98a6"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="16"
    font-weight="500"
    letter-spacing="4"
  >
    IT · SOFTWARE · INFRASTRUCTURE
  </text>
</svg>
