<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="120"
  viewBox="0 0 1200 120"
  role="img"
  aria-label="Je transforme des problèmes techniques en solutions concrètes."
>
  <defs>
    <linearGradient
      id="rt-gradient"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="0%"
    >
      <stop offset="0%" stop-color="#53aee5"/>
      <stop offset="100%" stop-color="#59cf79"/>
    </linearGradient>
  </defs>

  <text
    x="0"
    y="70"
    fill="#f3f6f8"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="42"
    font-weight="700"
    letter-spacing="-1.5"
  >
    Je transforme des
  </text>

  <text
    x="345"
    y="70"
    fill="url(#rt-gradient)"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="42"
    font-weight="700"
    letter-spacing="-1.5"
  >
    problèmes techniques
  </text>

  <text
    x="765"
    y="70"
    fill="#f3f6f8"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="42"
    font-weight="700"
    letter-spacing="-1.5"
  >
    en solutions concrètes.
  </text>

  <rect
    x="765"
    y="80"
    width="365"
    height="2"
    rx="1"
    fill="url(#rt-gradient)"
  />
</svg>
