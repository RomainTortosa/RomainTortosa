<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="330"
  viewBox="0 0 1200 330"
  role="img"
  aria-label="Je transforme des problèmes techniques en solutions concrètes."
>
  <defs>
    <linearGradient
      id="rt-gradient"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="0%"
    >
      <stop offset="0%" stop-color="#53aee5"/>
      <stop offset="100%" stop-color="#59cf79"/>
    </linearGradient>
  </defs>

  <!-- Ligne 1 -->
  <text
    x="0"
    y="82"
    fill="#f3f6f8"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="64"
    font-weight="700"
    letter-spacing="-2.5"
  >
    Je transforme des
  </text>

  <!-- Ligne 2 : texte avec dégradé -->
  <text
    x="0"
    y="157"
    fill="url(#rt-gradient)"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="64"
    font-weight="700"
    letter-spacing="-2.5"
  >
    problèmes techniques
  </text>

  <!-- Ligne 3 -->
  <text
    x="0"
    y="232"
    fill="#f3f6f8"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="64"
    font-weight="700"
    letter-spacing="-2.5"
  >
    en
  </text>

  <!-- "solutions concrètes." -->
  <text
    x="112"
    y="232"
    fill="#f3f6f8"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="64"
    font-weight="700"
    letter-spacing="-2.5"
  >
    solutions concrètes.
  </text>

  <!-- Soulignement dégradé -->
  <rect
    x="112"
    y="246"
    width="545"
    height="3"
    rx="1.5"
    fill="url(#rt-gradient)"
  />
</svg>
